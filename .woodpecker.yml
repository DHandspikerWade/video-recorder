steps:
- name: Build & publish  
  image: woodpeckerci/plugin-docker-buildx:5.1.0
  settings:
    username:
      from_secret: docker_username
    password: 
      from_secret: docker_password
    registry: ghcr.io
    repo: ghcr.io/dhandspikerwade/video-recorder
    tags: latest
    default_labels: false
    dry_run: false
    pull_image: true
    platforms: linux/amd64
  when:
    branch:
    - master

- name: Build & publish Experimental
  image: woodpeckerci/plugin-docker-buildx:5.1.0
  settings:
    username:
      from_secret: docker_username
    password: 
      from_secret: docker_password
    registry: ghcr.io
    repo: ghcr.io/dhandspikerwade/video-recorder
    tags: kube-experimental
    default_labels: false
    dry_run: false
    pull_image: true
    platforms: linux/amd64
  when:
    branch:
    - kube-experimental

# Just test build branches
- name: Build  
  image: woodpeckerci/plugin-docker-buildx:5.1.0
  settings:
    repo: ghcr.io/dhandspikerwade/video-recorder
    tags: latest
    default_labels: false
    dry_run: true
    pull_image: true
    platforms: linux/amd64
  when:
    branch:
      exclude:
      - master
      - kube-experimental
